name: Publish SDK
# Publishes packages/sdk to npm when a tag like sdk-v0.2.0 is pushed (or by hand from the Actions tab).
# Auth is npm Trusted Publishing (OIDC): npmjs.com trusts this repo + this workflow file, so no token is stored
# and nothing expires. Set it up once on npmjs.com, @cloakely/sdk, Settings, Trusted Publisher (GitHub Actions,
# owner NECOKIZZ, repo Cloak (capital C), workflow publish-sdk.yml). No NPM_TOKEN secret is used.
# Provenance is attached, so npm shows it was built from this repo by this workflow.
on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@^11.5.1 # trusted publishing needs npm 11.5.1+
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cloakely/sdk build && pnpm --filter @cloakely/sdk test
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          v=$(node -p "require('./packages/sdk/package.json').version")
          test "sdk-v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version $v"; exit 1; }
      - name: Publish
        working-directory: packages/sdk
        run: npm publish --provenance --access public
