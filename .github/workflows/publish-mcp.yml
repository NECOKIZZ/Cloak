name: Publish MCP server
# Publishes packages/mcp (@cloakely/mcp) to npm when a tag like mcp-v0.1.0 is pushed (or by hand from the Actions tab).
# Auth is npm Trusted Publishing (OIDC), like publish-sdk.yml: on npmjs.com, @cloakely/mcp, Settings, Trusted
# Publisher (GitHub Actions, owner NECOKIZZ, repo Cloak, workflow publish-mcp.yml).
# npm only offers that setting once a package exists, so the very first version can go out with a short-lived token
# instead: add it as the NPM_TOKEN secret, run this once, set up the trusted publisher, then delete the secret.
on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@^11.5.1 # trusted publishing needs npm 11.5.1+
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cloakely/sdk build && pnpm --filter @cloakely/mcp build && pnpm --filter @cloakely/mcp test
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          v=$(node -p "require('./packages/mcp/package.json').version")
          test "mcp-v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version $v"; exit 1; }
      # pnpm pack turns the workspace:^ dependency on @cloakely/sdk into a real version range
      - name: Pack
        working-directory: packages/mcp
        run: pnpm pack && mv cloakely-mcp-*.tgz /tmp/mcp.tgz
      - name: Publish (trusted publishing)
        if: env.HAS_TOKEN != 'true'
        run: npm publish /tmp/mcp.tgz --provenance --access public
      - name: Publish (first release, with a token)
        if: env.HAS_TOKEN == 'true'
        run: npm publish /tmp/mcp.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
