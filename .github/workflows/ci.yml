name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cd contracts && forge test -vv
      - run: pnpm --filter @cloak/sdk build && pnpm --filter @cloak/sdk test
      - run: pnpm --filter @cloak/web build
      - name: e2e on anvil (real drand beacon)
        run: |
          anvil --silent --balance 1000000 &
          sleep 2
          node e2e/run.mjs
          node e2e/private.mjs
