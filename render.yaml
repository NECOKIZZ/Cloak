services:
  - type: web
    name: cloak-keeper
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @cloak/sdk build
    startCommand: node services/keeper/index.mjs
    envVars:
      - key: KEEPER_PK
        sync: false
      - key: FACTORY
        sync: false
      - key: START_BLOCK
        sync: false
      - key: ROUTER
        value: "0xfa2574cfc3afb8f7d3a0651fa2111ff4e3d2fc41"
      - key: BATCHER
        value: "0xf6582cc5a84fccf74e571e652fb7b603a2c25812"
      - key: BATCHER_BLOCK
        value: "10980614"
  - type: web
    name: cloak-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @cloak/sdk build && pnpm --filter @cloak/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_FACTORY
        sync: false
      - key: VITE_KEEPER_URL
        sync: false
      - key: VITE_RELAYER_URL
        sync: false
