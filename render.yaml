services:
  - type: web
    name: cloak-keeper
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @cloakely/sdk build
    startCommand: node services/keeper/index.mjs
    envVars:
      - key: KEEPER_PK
        sync: false
      # Every contract address comes from CloakConfig's registry (Cloak v4 on Elysium testnet:
      # deployments/elysium-testnet-v4.json). With CONFIG set, FACTORY/ROUTER/BATCHER/… are ignored.
      - key: CONFIG
        value: "0x9fdf166f0671166148ea98cdd3ef0118d256167f"
      # seconds after the reveal window before the keeper pushes unclaimed bids to wallets, so winners can claim privately
      - key: CLAIM_DELAY
        value: "3600"
  - type: web
    name: cloak-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @cloakely/sdk build && pnpm --filter @cloakely/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_KEEPER_URL
        sync: false
      - key: VITE_RELAYER_URL
        sync: false
