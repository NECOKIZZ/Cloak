<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/logo.svg" />
    <title>Cloak · Fair launches and private trading on Elysium</title>
    <meta name="description" content="Launches nobody can snipe, trades nobody can trace. Sealed-bid launches with one clearing price and locked liquidity, then private balances, swaps, batches and sends on Elysium." />
    <script>
      try {
        var t = localStorage.getItem("cloak.theme") || "auto";
        var d = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dark" : "light";
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
