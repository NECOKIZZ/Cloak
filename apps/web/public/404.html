<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page not found · Cloak</title>
<link rel="icon" href="/logo.svg" />
<style>
  :root { --paper: #f8f7f4; --ink: #10161a; --mute: #5f6a6e; --signal: #2d7388; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0b1013; --ink: #eef1f0; --mute: #8fa0a6; --signal: #6cb6cb; } }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px 16px; text-align: center; box-sizing: border-box; }
  h1 { margin: 0; font-size: 28px; }
  p { margin: 0; color: var(--mute); }
  a { color: var(--signal); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="/logo.svg" alt="Cloak" width="48" height="48" />
  <h1>Page not found</h1>

</main>
