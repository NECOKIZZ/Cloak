<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ── brand: never change these, they are the site's dark theme ── */
      @font-face { font-family: "Inter Tight"; src: url("assets/intertight.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Mono"; src: url("assets/mono.woff2") format("woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b1013; }
      :root { --ink: #eef1f0; --mute: rgba(238, 241, 240, 0.62); --faint: rgba(238, 241, 240, 0.56); --line: rgba(238, 241, 240, 0.14); --sig: #6cb6cb; --seal: #e3a95a; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Inter Tight", sans-serif; color: var(--ink); }

      #bg { position: absolute; inset: 0; }
      #glass { position: absolute; top: 0; left: -660px; width: 3240px; height: 1080px; background: url("assets/glass.jpg") center/cover no-repeat; }
      #shade { position: absolute; inset: 0; background: radial-gradient(1300px 820px at 50% 48%, rgba(11, 16, 19, 0.86), rgba(11, 16, 19, 0.5) 64%, rgba(11, 16, 19, 0.3)); }
      #glow { position: absolute; left: 50%; top: 50%; width: 1500px; height: 1000px; margin: -500px 0 0 -750px; border-radius: 50%; background: radial-gradient(closest-side, rgba(108, 182, 203, 0.16), rgba(108, 182, 203, 0)); }

      .glassy { background: rgba(238, 241, 240, 0.06); border: 1px solid var(--line); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
      .soft { will-change: transform, opacity, filter; }
      .seal { border-radius: 10px; background: repeating-linear-gradient(90deg, rgba(238, 241, 240, 0.32) 0 14px, rgba(238, 241, 240, 0.14) 14px 28px); }

      /* headline above the stage: plain ink, the payoff in signal teal */
      #kicker { position: absolute; left: 0; right: 0; top: 92px; text-align: center; font-size: 46px; letter-spacing: -0.025em; }
      #kicker > div { position: absolute; left: 0; right: 0; }
      #kicker span { color: var(--sig); }
      #stage { position: absolute; left: 50%; top: 52%; width: 0; height: 0; }

      /* ── EDIT: the story's cards ── */
      #card { position: absolute; left: -560px; top: -270px; width: 1120px; height: 540px; border-radius: 32px; padding: 56px; }
      #card h2 { font-size: 64px; font-weight: 500; letter-spacing: -0.04em; }
      #card p { font-size: 28px; color: var(--mute); margin-top: 12px; }
      #card .bars { margin-top: 56px; display: grid; gap: 22px; }
      #card .bars .seal { height: 34px; }

      /* end card: mark, title, glassy pill, mono caps subline */
      #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #endmark { height: 150px; }
      #endtitle { margin-top: 46px; font-size: 80px; font-weight: 500; letter-spacing: -0.04em; }
      #endtitle span { color: var(--sig); }
      #endpill { margin-top: 34px; padding: 20px 36px; border-radius: 999px; font-family: "Mono"; font-size: 34px; }
      #endsub { margin-top: 32px; font-family: "Mono"; font-size: 22px; letter-spacing: 0.12em; color: var(--mute); display: flex; align-items: center; gap: 12px; }
      #endsub i { width: 10px; height: 10px; border-radius: 50%; background: var(--sig); }
    </style>
  </head>
  <body>
    <!-- EDIT: data-duration here, on the audio, the backdrop and each scene -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <audio id="score" src="assets/score.wav" data-start="0" data-duration="10" data-volume="1" data-track-index="3"></audio>
      <div id="bg" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div id="glass"></div>
        <div id="shade"></div>
        <div id="glow"></div>
      </div>

      <div id="scene1" class="clip" data-start="0" data-duration="7.7" data-track-index="1">
        <div id="kicker" class="soft">
          <div id="k1">A short line. <span>The payoff in teal.</span></div>
        </div>
        <div id="stage">
          <div id="card" class="glassy soft">
            <h2>Card title</h2>
            <p>What this beat shows, in plain words</p>
            <div class="bars"><div class="seal" style="width: 70%"></div><div class="seal" style="width: 52%"></div><div class="seal" style="width: 61%"></div></div>
          </div>
        </div>
      </div>

      <div id="scene2" class="clip" data-start="7.25" data-duration="2.75" data-track-index="2">
        <div id="end">
          <svg id="endmark" class="soft" viewBox="0 0 279 322"><path d="M149.671 0C119.989 12.7135 73.3456 40.2595 58.5046 74.1622C41.5434 118.659 37.3031 192.822 3.38073 266.984C-2.97971 279.697 -0.859564 288.173 13.9815 294.53C62.7449 317.838 117.869 326.314 160.272 319.957C209.035 315.719 247.198 298.768 279 275.459L232.357 209.773C213.275 230.962 187.834 243.676 160.272 245.795C117.869 250.032 86.0665 226.724 86.0665 186.465C86.0665 137.73 115.749 93.2324 149.671 69.9243C172.993 84.7568 194.194 108.065 206.915 133.492L257.799 103.827C234.477 57.2108 189.954 19.0703 149.671 0Z" fill="#EEF1F0" /></svg>
          <div id="endtitle" class="soft">The announcement, <span>in a few words</span></div>
          <div id="endpill" class="glassy soft">cloak.boblabs.tech</div>
          <div id="endsub" class="soft"><i></i>PRIVATE LAUNCHES AND TRADING ON ELYSIUM</div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const D = 10, T_OUT = 7.0, T_END = 7.35; // EDIT: total length, story exit, end card in

      // the motion vocabulary (keep these so every Cloak video moves the same way)
      const blurIn = (sel, at, o = {}) => tl.fromTo(sel, { opacity: 0, y: o.y ?? 18, scale: o.scale ?? 1, filter: "blur(12px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: o.d ?? 0.7, ease: "power3.out", stagger: o.stagger ?? 0 }, at);
      const blurOut = (sel, at, o = {}) => tl.to(sel, { opacity: 0, y: o.y ?? -12, filter: "blur(10px)", duration: o.d ?? 0.35, ease: "power2.in" }, at);

      // backdrop drift, the whole length
      tl.fromTo("#glass", { x: 0, scale: 1.05 }, { x: 240, scale: 1, duration: D, ease: "none" }, 0);
      tl.fromTo("#glow", { opacity: 0.5, scale: 0.9 }, { opacity: 1, scale: 1.08, duration: D, ease: "sine.inOut" }, 0);

      // EDIT: the story beats
      tl.fromTo("#card", { opacity: 0, scale: 0.94, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 0.05);
      blurIn("#card h2, #card p", 0.5, { stagger: 0.14 });
      blurIn("#card .seal", 0.9, { y: 14, stagger: 0.12 });
      tl.fromTo("#card .seal", { backgroundPositionX: 0 }, { backgroundPositionX: 168, duration: 6, ease: "none" }, 1.0);
      blurIn("#k1", 1.4);
      tl.fromTo("#stage", { scale: 1 }, { scale: 1.035, duration: T_OUT - 1, ease: "sine.inOut" }, 1);

      // collapse into the end card
      tl.to(["#kicker", "#card"], { opacity: 0, scale: 0.94, filter: "blur(16px)", duration: 0.42, ease: "power2.in", stagger: 0.03 }, T_OUT);
      tl.fromTo("#endmark", { opacity: 0, scale: 0.7, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, T_END);
      blurIn("#endtitle", T_END + 0.35, { y: 16 });
      tl.fromTo("#endpill", { opacity: 0, y: 14, scale: 0.96, filter: "blur(10px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.65, ease: "power3.out" }, T_END + 0.65);
      tl.fromTo("#endsub", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, T_END + 0.95);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
